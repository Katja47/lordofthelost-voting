<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/LOTL_voting.css" rel="stylesheet" type="text/css">
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css' rel='stylesheet'>
    <title>LORD OF THE LOST | Setlist Voting</title>
    <!-- Favicon-->
    <link href="img/LOTL_ON_favicon.ico" rel="icon" type="image/x-icon"/>
    <style>

        .background-image {
            background-image: url("/img/LOTL_ON_bandpic.jpg");
            background-position: top;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;

            filter: blur(8px);
            -webkit-filter: blur(8px);

            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            isolation: isolate;
            background-color: rgba(0, 0, 0, 0.4);
            border: 3px solid #f1f1f1;

            padding: 20px;
            text-align: center;

            min-height: 100vh;
        }


        p {
            opacity: 0;
            color: #ce0c97;
            animation-fill-mode: both;
            -webkit-animation-duration: 1.5s;
            -webkit-animation-delay: .6s;
            -webkit-animation-fill-mode: both;
            animation-name: fadeInUp;
            -webkit-animation-name: fadeInUp;
        }

        a {
            opacity: 0;
            animation-fill-mode: both;
            -webkit-animation-duration: 1.5s;
            -webkit-animation-delay: .8s;
            -webkit-animation-fill-mode: both;
            animation-name: fadeInUp;
            -webkit-animation-name: fadeInUp;
        }

        body p {
            text-align: center;
        }


        /* –––––– LOTL ANIMATIONS –––––– */
        /* –––––– (c) Timo Kahl –––––– */

        @keyframes fadeInUp {
            from {
                transform: translate3d(0, 40px, 0)
            }

            to {
                transform: translate3d(0, 0, 0);
                opacity: 1
            }
        }

        @-webkit-keyframes fadeInUp {
            from {
                transform: translate3d(0, 40px, 0)
            }

            to {
                transform: translate3d(0, 0, 0);
                opacity: 1
            }
        }

    </style>
</head>


<body>

<div class="background-image"></div>

<div class="content">

    <!-- Google Form -->
    <iframe frameborder="0"
            height="1300"
            marginheight="0"
            marginwidth="0"

</div>
